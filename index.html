<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>안전골든벨</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔔</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">

    <!-- FR-01 시작 화면 -->
    <section id="screen-start" class="screen screen-start">
      <header class="hero">
        <div class="hero-bell" aria-hidden="true">🔔</div>
        <h1 class="hero-title">안전<span>골든벨</span></h1>
        <p class="hero-sub">안전 · 보건 · 환경 · 소방 · 위험물 · 시험실화학물질</p>
      </header>

      <div class="card rules-card">
        <h2 class="card-title">게임 방법</h2>
        <ul class="rules">
          <li><span class="rule-icon" aria-hidden="true">✏️</span>5지선다 객관식 퀴즈입니다.</li>
          <li><span class="rule-icon" aria-hidden="true">📚</span>카테고리를 고르면 해당 분야 10문제가 출제됩니다.</li>
          <li><span class="rule-icon" aria-hidden="true">⏱</span>문제당 20초, 한 문제에 10점입니다.</li>
          <li><span class="rule-icon" aria-hidden="true">💡</span>답을 고르면 바로 정답과 해설을 알려 드립니다.</li>
        </ul>
      </div>

      <div class="card name-card">
        <label for="player-name" class="field-label">참가자 이름</label>
        <input id="player-name" class="field-input" type="text" maxlength="10" placeholder="1~10자로 입력하세요" autocomplete="off">
        <p id="name-hint" class="hint" aria-live="polite">이름을 입력하면 시작할 수 있습니다.</p>
        <div class="buttons">
          <button id="btn-start" class="btn btn-primary btn-lg" type="button" disabled>게임 시작</button>
          <button id="btn-ranking-from-start" class="btn btn-ghost btn-lg" type="button">🏆 순위 보기</button>
        </div>
      </div>
    </section>

    <!-- FR-02 카테고리 선택 -->
    <section id="screen-category" class="screen" hidden>
      <h2 class="screen-title">카테고리 선택</h2>
      <p class="screen-sub">도전할 분야를 고르세요.</p>
      <div id="category-list" class="category-list"></div>
      <button id="btn-all" class="btn btn-primary btn-lg btn-block" type="button">🏆 전체 도전 (60문제)</button>
      <button id="btn-category-home" class="btn btn-ghost btn-block" type="button">← 처음으로 (이름 바꾸기)</button>
    </section>

    <!-- FR-03 문제 풀이 / FR-04 즉시 피드백 -->
    <section id="screen-quiz" class="screen screen-quiz" hidden>
      <div class="quiz-header">
        <span id="quiz-category" class="chip chip-category"></span>
        <span id="quiz-progress" class="chip"></span>
        <span id="quiz-score" class="chip chip-score"></span>
        <span id="quiz-timer" class="chip chip-timer" role="timer"></span>
      </div>
      <div class="bars">
        <div class="bar bar-progress" aria-hidden="true"><div id="quiz-progress-bar" class="bar-fill"></div></div>
        <div class="bar bar-timer" aria-hidden="true"><div id="quiz-timer-bar" class="bar-fill"></div></div>
      </div>
      <div class="card question-card">
        <p id="quiz-question" class="question" tabindex="-1"></p>
      </div>
      <ol id="quiz-options" class="options"></ol>
      <div id="quiz-feedback" class="feedback" aria-live="polite" hidden></div>
      <button id="btn-next" class="btn btn-primary btn-lg btn-block" type="button" hidden>다음 문제</button>
      <p class="key-hint">키보드 <kbd>1</kbd>~<kbd>5</kbd> 로 선택, <kbd>Enter</kbd> 로 다음</p>
      <button id="btn-quit" class="btn btn-danger-ghost btn-quit" type="button">그만두기</button>
    </section>

    <!-- FR-05 결과 화면 -->
    <section id="screen-result" class="screen screen-result" hidden>
      <h2 class="screen-title">결과</h2>
      <div id="result-summary" class="card result-card"></div>
      <div id="result-wrong"></div>
      <div class="buttons buttons-3">
        <button id="btn-retry" class="btn btn-primary" type="button">🔄 다시 하기</button>
        <button id="btn-other-category" class="btn btn-secondary" type="button">📚 다른 카테고리</button>
        <button id="btn-ranking-from-result" class="btn btn-secondary" type="button">🏆 순위 보기</button>
      </div>
    </section>

    <!-- FR-06 순위 -->
    <section id="screen-ranking" class="screen" hidden>
      <h2 class="screen-title">🏆 명예의 전당</h2>
      <div id="ranking-tabs" class="tabs"></div>
      <div id="ranking-table" class="card ranking-card"></div>
      <div class="buttons">
        <button id="btn-home" class="btn btn-primary" type="button">처음으로</button>
        <button id="btn-ranking-reset" class="btn btn-danger-ghost" type="button">순위 초기화</button>
      </div>
    </section>

  </main>

  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <!-- file:// 로 열어도 동작하도록 문제를 전역 변수로 먼저 불러옵니다 -->
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
